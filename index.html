<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flowing Waves</title>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  a { text-decoration:none; color:inherit; }

  /* ── layout ─────────────────────────────────────────── */
  .app {
    display: flex;
    width:100%; height:100vh; height:100dvh;
    overflow:hidden;
    font-family: system-ui,-apple-system,"Segoe UI",sans-serif;
    background:#000;
  }
  .main-area { position:relative; flex:1; min-width:0; }

  /* ── waves ──────────────────────────────────────────── */
  #waves { position:absolute; inset:0; z-index:0; }
  #waves canvas { display:block; width:100%!important; height:100%!important; }

  /* ── mobile topbar ──────────────────────────────────── */
  .topbar {
    position:relative; z-index:50;
    height:2.5rem;
    display:flex; align-items:center; justify-content:flex-end;
    padding:0 1rem;
    background:#262626;
  }
  .topbar button { background:none; border:none; color:#e5e5e5; cursor:pointer; }

  @media(min-width:768px){ .topbar { display:none; } }

  /* ── desktop rail ───────────────────────────────────── */
  .rail {
    height:100dvh; width:60px;
    background:#262626;
    display:none; flex-direction:column; justify-content:space-between;
    padding:1rem 0.75rem;
    flex-shrink:0;
    transition:width .3s ease-in-out;
    overflow:hidden;
  }
  .rail:hover { width:300px; }
  .rail:hover .rail-label { opacity:1; transition-delay:.15s; }

  @media(min-width:768px){ .rail{display:flex;} }

  .rail-label {
    opacity:0;
    white-space:nowrap;
    transition:opacity .2s ease-in-out;
  }

  .rail-links { display:flex; flex-direction:column; gap:0.5rem; margin-top:2rem; }

  /* ── shared link/logo/avatar ────────────────────────── */
  .link, .overlay-link {
    display:flex; align-items:center; gap:0.5rem;
    padding:0.5rem 0; font-size:0.875rem; color:#e5e5e5;
    white-space:nowrap; transition:transform .15s ease;
  }
  .link:hover, .overlay-link:hover { transform:translateX(4px); }
  .link svg, .overlay-link svg { width:20px; height:20px; flex-shrink:0; }

  .logo { display:flex; align-items:center; gap:0.5rem; font-size:0.875rem; color:#fff; white-space:nowrap; }
  .logo-box {
    width:1.5rem; height:1.25rem; background:#fff; flex-shrink:0;
    border-radius: 0.5rem 0.125rem 0.5rem 0.125rem;
  }

  .avatar {
    width:1.75rem; height:1.75rem; border-radius:9999px;
    background:#525252; color:#fff; font-size:0.7rem;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }

  /* ── mobile overlay ─────────────────────────────────── */
  .overlay {
    position:fixed; inset:0; z-index:100;
    background:#171717;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:2.5rem;
    transform:translateX(-100%); opacity:0; pointer-events:none;
    transition:transform .3s ease-in-out, opacity .3s ease-in-out;
  }
  .overlay.open { transform:translateX(0); opacity:1; pointer-events:auto; }
  .overlay-close {
    position:absolute; right:2.5rem; top:2.5rem;
    background:none; border:none; color:#e5e5e5; cursor:pointer;
  }
  .overlay-links { display:flex; flex-direction:column; gap:0.5rem; margin-top:2rem; }

  @media(min-width:768px){ .overlay { display:none; } }

  /* ── reduced motion ─────────────────────────────────── */
  @media(prefers-reduced-motion:reduce){
    .rail{transition:none;width:300px;}
    .rail-label{opacity:1;}
    .overlay{transition:none;transform:none;opacity:0;pointer-events:none;}
    #waves canvas{display:none;}
    .app{background:radial-gradient(120% 90% at 50% 0%,#101b33 0%,#060b16 100%);}
  }
</style>

<!-- ── waves shader ──────────────────────────────────── -->
<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

const container = document.getElementById("waves");
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  container.appendChild(renderer.domElement);
} catch(e) {
  container.innerHTML = '<p style="color:#fff;text-align:center;padding-top:40vh">WebGL no disponible</p>';
  throw e;
}

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const clock = new THREE.Clock();

const vertexShader = `
varying vec2 vTextureCoord;
void main(){ vTextureCoord=uv; gl_Position=vec4(position,1.0); }`;

const fragmentShader = `
precision mediump float;
uniform vec2 iResolution; uniform float iTime;
uniform bool hasActiveReminders; uniform bool hasUpcomingReminders; uniform bool disableCenterDimming;
varying vec2 vTextureCoord;

void mainImage(out vec4 fragColor,in vec2 fragCoord){
  vec2 uv=(2.0*fragCoord-iResolution.xy)/min(iResolution.x,iResolution.y);
  vec2 center=iResolution.xy*0.5;
  float dist=distance(fragCoord,center);
  float radius=min(iResolution.x,iResolution.y)*0.5;
  float dim=disableCenterDimming?1.0:smoothstep(radius*0.3,radius*0.5,dist);
  for(float i=1.0;i<10.0;i++){
    uv.x+=0.6/i*cos(i*2.5*uv.y+iTime);
    uv.y+=0.6/i*cos(i*1.5*uv.x+iTime);
  }
  if(hasActiveReminders)      fragColor=vec4(vec3(0.1,0.3,0.6)/abs(sin(iTime-uv.y-uv.x)),1.0);
  else if(hasUpcomingReminders)fragColor=vec4(vec3(0.1,0.5,0.2)/abs(sin(iTime-uv.y-uv.x)),1.0);
  else                        fragColor=vec4(vec3(0.1)/abs(sin(iTime-uv.y-uv.x)),1.0);
  if(!disableCenterDimming) fragColor.rgb=mix(fragColor.rgb*0.3,fragColor.rgb,dim);
}
void main(){
  vec4 c; mainImage(c,vTextureCoord*iResolution); gl_FragColor=c;
}`;

const uniforms = {
  iTime:                {value:0},
  iResolution:          {value:new THREE.Vector2()},
  iMouse:               {value:new THREE.Vector2()},
  hasActiveReminders:   {value:false},
  hasUpcomingReminders: {value:false},
  disableCenterDimming: {value:true},
};

const material = new THREE.ShaderMaterial({vertexShader,fragmentShader,uniforms});
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),material));

const onResize=()=>{
  const w=container.clientWidth, h=container.clientHeight;
  renderer.setSize(w,h); uniforms.iResolution.value.set(w,h);
};
window.addEventListener("resize",onResize); onResize();

renderer.setAnimationLoop(()=>{
  uniforms.iTime.value=clock.getElapsedTime()*0.4;
  renderer.render(scene,camera);
});
</script>

<!-- ── sidebar toggle ─────────────────────────────────── -->

  document.getElementById('close-btn').addEventListener('click',function(){ ov.classList.remove('open'); });
})();
</script>
