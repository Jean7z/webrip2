<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flowing Waves</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  .hero-section {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #000;
  }

  #waves {
    position: absolute;
    inset: 0;
    z-index: 0;
  }
  #waves canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
  }

  @media (prefers-reduced-motion: reduce) {
    #waves canvas { display: none; }
    .hero-section { background: radial-gradient(120% 90% at 50% 0%, #101b33 0%, #060b16 100%); }
  }
</style>
</head>
<body>
<main class="hero-section">
  <div id="waves" aria-label="Animated wave background"></div>
</main>

<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

const container = document.getElementById("waves");

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);
} catch (e) {
  container.innerHTML = '<p style="color:#fff;text-align:center;padding-top:40vh">WebGL no disponible</p>';
  throw e;
}

const scene  = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const clock  = new THREE.Clock();

const vertexShader = `
varying vec2 vTextureCoord;
void main() {
  vTextureCoord = uv;
  gl_Position = vec4(position, 1.0);
}`;

const fragmentShader = `
precision mediump float;
uniform vec2  iResolution;
uniform float iTime;
uniform bool  hasActiveReminders;
uniform bool  hasUpcomingReminders;
uniform bool  disableCenterDimming;
varying vec2  vTextureCoord;

void mainImage(out vec4 fragColor, in vec2 fragCoord) {
  vec2 uv = (2.0 * fragCoord - iResolution.xy) / min(iResolution.x, iResolution.y);

  vec2  center = iResolution.xy * 0.5;
  float dist   = distance(fragCoord, center);
  float radius = min(iResolution.x, iResolution.y) * 0.5;
  float dim    = disableCenterDimming ? 1.0 : smoothstep(radius * 0.3, radius * 0.5, dist);

  for (float i = 1.0; i < 10.0; i++) {
    uv.x += 0.6 / i * cos(i * 2.5 * uv.y + iTime);
    uv.y += 0.6 / i * cos(i * 1.5 * uv.x + iTime);
  }

  if      (hasActiveReminders)   fragColor = vec4(vec3(0.1, 0.3, 0.6) / abs(sin(iTime - uv.y - uv.x)), 1.0);
  else if (hasUpcomingReminders) fragColor = vec4(vec3(0.1, 0.5, 0.2) / abs(sin(iTime - uv.y - uv.x)), 1.0);
  else                           fragColor = vec4(vec3(0.1)           / abs(sin(iTime - uv.y - uv.x)), 1.0);

  if (!disableCenterDimming) fragColor.rgb = mix(fragColor.rgb * 0.3, fragColor.rgb, dim);
}

void main() {
  vec4 color;
  mainImage(color, vTextureCoord * iResolution);
  gl_FragColor = color;
}`;

const uniforms = {
  iTime:                { value: 0 },
  iResolution:          { value: new THREE.Vector2() },
  iMouse:               { value: new THREE.Vector2() },
  hasActiveReminders:   { value: false },
  hasUpcomingReminders: { value: false },
  disableCenterDimming: { value: true }, // sin sombra central
};

const material = new THREE.ShaderMaterial({ vertexShader, fragmentShader, uniforms });
const geometry = new THREE.PlaneGeometry(2, 2);
scene.add(new THREE.Mesh(geometry, material));

const onResize = () => {
  const w = container.clientWidth;
  const h = container.clientHeight;
  renderer.setSize(w, h);
  uniforms.iResolution.value.set(w, h);
};
window.addEventListener("resize", onResize);
onResize();

renderer.setAnimationLoop(() => {
  uniforms.iTime.value = clock.getElapsedTime() * 0.4; // slow motion
  renderer.render(scene, camera);
});
</script>
</body>
</html>
